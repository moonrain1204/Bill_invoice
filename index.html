<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-4">
    <div class="max-w-md mx-auto bg-white rounded-xl shadow-md overflow-hidden p-6">
        <h2 class="text-center text-xl font-bold text-blue-600 mb-4">發票掃描記錄系統</h2>
        
        <div class="border-2 border-dashed border-gray-300 rounded-lg p-2 mb-4 text-center">
            <img id="preview" class="hidden w-full h-48 object-contain mx-auto">
            <p id="placeholder" class="text-gray-400">尚未拍攝照片</p>
        </div>

        <input type="file" id="fileInput" accept="image/*" capture="camera" class="hidden" onchange="handleFile(this)">
        <button onclick="document.getElementById('fileInput').click()" class="w-full bg-blue-500 text-white font-bold py-3 rounded-full mb-6 shadow-lg">
            📸 拍照或選取發票
        </button>

        <div id="loading" class="hidden text-center text-blue-500 font-bold mb-4">AI 辨識中，請稍候...</div>

        <div id="resultForm" class="space-y-4">
            <div><label class="text-xs text-gray-500">類型</label><input id="resType" type="text" class="w-full border-b"></div>
            <div><label class="text-xs text-gray-500">車號</label><input id="resCarId" type="text" class="w-full border-b"></div>
            <div><label class="text-xs text-gray-500">發票號碼</label><input id="resInvoiceNum" type="text" class="w-full border-b"></div>
            <div><label class="text-xs text-gray-500">金額</label><input id="resAmount" type="number" class="w-full border-b text-red-500 font-bold"></div>
            <div><label class="text-xs text-gray-500">備註 (提供人)</label><input id="resNote" type="text" class="w-full border-b"></div>
            
            <button onclick="saveToSheet()" class="w-full bg-green-500 text-white font-bold py-3 rounded-lg shadow-md">
                確認並存入試算表
            </button>
        </div>
    </div>

    <script>
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                
                // 呼叫後端開始辨識
                document.getElementById('loading').classList.remove('hidden');
                google.script.run
                    .withSuccessHandler(showResult)
                    .processImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function showResult(res) {
            document.getElementById('loading').classList.add('hidden');
            document.getElementById('resInvoiceNum').value = res.invoiceNum;
            document.getElementById('resAmount').value = res.amount;
            document.getElementById('resNote').value = res.note;
            document.getElementById('resType').value = res.type;
        }

        function saveToSheet() {
            const data = {
                type: document.getElementById('resType').value,
                carId: document.getElementById('resCarId').value,
                invoiceNum: document.getElementById('resInvoiceNum').value,
                amount: document.getElementById('resAmount').value,
                note: document.getElementById('resNote').value
            };
            google.script.run.withSuccessHandler(() => alert('儲存成功！')).saveData(data);
        }
    </script>
</body>
</html>
