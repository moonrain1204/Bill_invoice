<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .loading-spinner { border-top-color: #3b82f6; animation: spin 1s linear infinite; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-50 min-h-screen p-4">
    <div class="max-w-md mx-auto bg-white rounded-3xl shadow-xl overflow-hidden">
        <div class="bg-blue-700 p-5 text-white text-center font-bold text-lg tracking-wider">
            發票紀錄自動化系統
        </div>
        
        <div class="p-6 space-y-5">
            <div class="relative border-2 border-dashed border-slate-200 rounded-2xl bg-slate-50 overflow-hidden min-h-[200px] flex items-center justify-center">
                <img id="preview" class="hidden w-full h-full object-contain">
                <div id="placeholder" class="text-slate-400 text-center">
                    <p class="text-5xl mb-2">📸</p>
                    <p class="text-sm">請點擊下方按鈕載入發票</p>
                </div>
            </div>

            <input type="file" id="fileInput" accept="image/*" class="hidden" onchange="handleFile(this)">
            <button onclick="document.getElementById('fileInput').click()" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-bold shadow-lg transition-all active:scale-95">
                拍照或選取相簿
            </button>

            <div id="loading" class="hidden flex flex-col items-center justify-center space-y-2">
                <div class="loading-spinner w-8 h-8 border-4 border-slate-200 rounded-full"></div>
                <p class="text-blue-600 font-medium animate-pulse">Google AI 辨識中...</p>
            </div>

            <div id="resultForm" class="pt-4 border-t border-slate-100 space-y-4">
                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-400 ml-1">類型</label>
                        <input id="resType" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-400 ml-1">車號</label>
                        <input id="resCarId" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>
                
                <div class="space-y-1">
                    <label class="text-xs font-bold text-slate-400 ml-1">發票號碼</label>
                    <input id="resInvoiceNum" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm font-mono focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-400 ml-1">金額</label>
                        <input id="resAmount" type="number" class="w-full bg-slate-50 border-none rounded-xl p-3 text-lg font-bold text-red-600">
                    </div>
                    <div class="space-y-1">
                        <label class="text-xs font-bold text-slate-400 ml-1">備註 (提供人)</label>
                        <input id="resNote" class="w-full bg-slate-50 border-none rounded-xl p-3 text-sm focus:ring-2 focus:ring-blue-500">
                    </div>
                </div>

                <button onclick="saveToSheet()" id="saveBtn" class="w-full bg-emerald-500 hover:bg-emerald-600 text-white py-4 rounded-2xl font-bold shadow-md transition-all">
                    確認並存入試算表
                </button>
            </div>
        </div>
    </div>

    <script>
        function handleFile(input) {
            const file = input.files[0];
            if (!file) return;
            
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('preview').src = e.target.result;
                document.getElementById('preview').classList.remove('hidden');
                document.getElementById('placeholder').classList.add('hidden');
                document.getElementById('loading').classList.remove('hidden');
                
                google.script.run
                    .withSuccessHandler(res => {
                        document.getElementById('loading').classList.add('hidden');
                        document.getElementById('resInvoiceNum').value = res.invoiceNum;
                        document.getElementById('resAmount').value = res.amount;
                        document.getElementById('resNote').value = res.note;
                        document.getElementById('resType').value = res.type;
                        document.getElementById('resCarId').value = res.carId;
                    })
                    .processImage(e.target.result);
            };
            reader.readAsDataURL(file);
        }

        function saveToSheet() {
            const btn = document.getElementById('saveBtn');
            btn.disabled = true;
            btn.classList.add('opacity-50');
            
            const data = {
                type: document.getElementById('resType').value,
                carId: document.getElementById('resCarId').value,
                invoiceNum: document.getElementById('resInvoiceNum').value,
                amount: document.getElementById('resAmount').value,
                note: document.getElementById('resNote').value
            };
            
            google.script.run.withSuccessHandler(msg => {
                alert(msg);
                btn.disabled = false;
                btn.classList.remove('opacity-50');
            }).saveData(data);
        }
    </script>
</body>
</html>
